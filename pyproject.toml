[project]
name = "unilog-enricher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "a-y-a-n-das", email = "ayandas8125@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "firecrawl>=4.34.0",
    "fastapi>=0.115.0",
    "openai>=3.0.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.52",
    "exa-py>=1.0.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
]

[project.scripts]
unilog-enricher = "unilog_enricher:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
